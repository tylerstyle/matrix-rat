[package]
name = "matrix-rat"
version = "1.0.3"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "A mouse-friendly, themeable Matrix client for the terminal"
repository = "https://github.com/tylerstyle/matrix-rat"

[dependencies]
# What the core uses on both targets: the app, the drawing and the Matrix worker. What
# only the terminal, the OS, the command line and `serve` use is in the next section, the
# browser's own in the one after it (`cargo check --lib --target wasm32-unknown-unknown`).

# Matrix: the SDK and its timeline are given per target below.
# For decrypting attachments we download ourselves; same version as the SDK.
matrix-sdk-base = { version = "=0.20.0", features = ["e2e-encryption"] }

# TUI. No default features, which would pull crossterm into the browser; the native
# section adds its defaults back. `std`, which crossterm turns on: without it the layout
# cache wants a critical-section implementation.
ratatui = { version = "0.30.2", default-features = false, features = ["all-widgets", "layout-cache", "macros", "underline-color", "std"] }

# Runtime: tokio per target below.
futures = "0.3"

# Support
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-segmentation = "1"
url = "2"
unicode-width = "0.2"
emojis = "0.9.1"
nucleo-matcher = "0.3.1"
# The type the SDK wants for an attachment; same version as the SDK uses.
mime = "0.3"
# Wipes passwords and passphrases from memory when they are dropped; the version the SDK uses.
zeroize = "1"
comrak = { version = "1.2.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
toml_edit = "0.25.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }

# Native only: the terminal, the OS, the command line, `serve` and its clients. Every
# crate here has the same version and features as before the browser build existed.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Matrix. Pinned exactly: every minor release has breaking changes.
matrix-sdk = { version = "=0.20.0", features = ["bundled-sqlite", "sso-login", "socks", "qrcode", "experimental-search"] }
matrix-sdk-ui = "=0.20.0"

# TUI: ratatui with its default features, crossterm among them.
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }

# Runtime
# `process`, `net` and `io-util`: the audio player and mpv's control socket (src/audio),
# and the agent socket (src/agent). `io-std`: the MCP server on stdin and stdout.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "net", "io-util", "io-std"] }

# Support
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
signal-hook = "0.3"
# Splits $VISUAL / $EDITOR into words the way a shell does; already in the tree.
shlex = "2"
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
notify = "9"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }
# Same version & features notify-rust already pulls in, to watch XDG portal appearance.
zbus = { version = "6.5.0", default-features = false, features = ["default-rt", "proxy"] }

# The browser (`wasm32-unknown-unknown`).
[target.'cfg(target_family = "wasm")'.dependencies]
# The SDK without SQLite, the local login server, the search index and rustls with aws-lc
# (C code): the browser's fetch, IndexedDB for the stores (phase 2) and the JS glue.
matrix-sdk = { version = "=0.20.0", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "js", "indexeddb"] }
matrix-sdk-ui = { version = "=0.20.0", default-features = false, features = ["js"] }
# Channels, locks and `select!`; tasks and timers are crate::rt's.
tokio = { version = "1", features = ["sync", "macros"] }
# The browser has no `std::time` clock: `crate::time` takes its types from here.
web-time = "1"
# The browser's clock for chrono's `Local`/`Utc::now`.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind"] }
# The browser's tasks and timers for `crate::rt`: the versions matrix-sdk-common uses there.
gloo-timers = { version = "0.4.1", features = ["futures"] }
wasm-bindgen-futures = "0.4.80"

[dev-dependencies]
insta = "1"

[profile.dev.package."*"]
opt-level = 1

# Whole-program optimisation in one unit: the same code and speed as before, in a binary
# about 27% smaller (measured 2026-11-21: 103 MB -> 76 MB stripped), for a longer build.
# The smallest at opt-level 3 with unwinding; `panic = "abort"` would end the app on a
# panic in a spawned task (a bad picture), so it stays off.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
