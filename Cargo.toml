[package]
name = "matrix-rat"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "A mouse-friendly, themeable Matrix client for the terminal"
repository = "https://github.com/tylerstyle/matrix-rat"

[dependencies]
# Matrix. Pinned exactly: every minor release has breaking changes.
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite", "sso-login", "socks", "qrcode"] }
matrix-sdk-ui = "=0.19.1"

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }

# Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"

# Support
anyhow = "1"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
unicode-segmentation = "1"
url = "2"
unicode-width = "0.2"
emojis = "0.9.1"
nucleo-matcher = "0.3.1"
comrak = { version = "0.59.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
notify = "8"
toml_edit = "0.25.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }

[dev-dependencies]
insta = "1"
mime = "0.3"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = true
