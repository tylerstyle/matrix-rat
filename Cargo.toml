[package]
name = "matrix-rat"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "A mouse-friendly, themeable Matrix client for the terminal"
repository = "https://github.com/tylerstyle/matrix-rat"

[dependencies]
# Matrix. Pinned exactly: every minor release has breaking changes.
matrix-sdk = { version = "=0.19.1", features = ["bundled-sqlite", "sso-login", "socks", "qrcode", "experimental-search"] }
matrix-sdk-ui = "=0.19.1"
# For decrypting attachments we download ourselves; same version as the SDK.
matrix-sdk-base = { version = "=0.19.1", features = ["e2e-encryption"] }

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }

# Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"

# Support
anyhow = "1"
clap = { version = "4", features = ["derive"] }
etcetera = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
libc = "0.2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
unicode-segmentation = "1"
url = "2"
unicode-width = "0.2"
emojis = "0.9.1"
nucleo-matcher = "0.3.1"
# The type the SDK wants for an attachment; same version as the SDK uses.
mime = "0.3"
comrak = { version = "0.59.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
notify = "8"
toml_edit = "0.25.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
notify-rust = { version = "4.19.0", default-features = false, features = ["z"] }
# Same version & features notify-rust already pulls in, to watch XDG portal appearance.
zbus = { version = "6.3.0", default-features = false, features = ["default-rt", "proxy"] }

[dev-dependencies]
insta = "1"

[profile.dev.package."*"]
opt-level = 1

# Whole-program optimisation in one unit: the same code and speed as before, in a binary
# about 30% smaller (about 92 MB -> 64 MB here), for a slightly longer link step.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
