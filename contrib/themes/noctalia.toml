# matrix-rat theme template for Noctalia (v5 and v4) and for matugen — they share the
# {{colors.<name>.default.hex}} syntax. See contrib/themes/README.md for how to register it.
name = "noctalia"

[palette]
bg = "{{colors.surface.default.hex}}"
surface = "{{colors.surface_container.default.hex}}"
surface_high = "{{colors.surface_container_high.default.hex}}"
fg = "{{colors.on_surface.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
outline = "{{colors.outline_variant.default.hex}}"
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
accent = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"

[users]
colors = [
    "{{colors.primary.default.hex}}",
    "{{colors.secondary.default.hex}}",
    "{{colors.tertiary.default.hex}}",
    "{{colors.error.default.hex}}",
    "{{colors.inverse_primary.default.hex}}",
    "{{colors.on_surface_variant.default.hex}}",
]
