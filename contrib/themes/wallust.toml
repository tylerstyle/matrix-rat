# matrix-rat theme template for wallust. See contrib/themes/README.md.
name = "wallust"

[palette]
bg = "{{background}}"
surface = "{{color0}}"
surface_high = "{{color8}}"
fg = "{{foreground}}"
muted = "{{color7}}"
outline = "{{color8}}"
primary = "{{color4}}"
on_primary = "{{background}}"
secondary = "{{color5}}"
accent = "{{color3}}"
error = "{{color1}}"
success = "{{color2}}"
warning = "{{color3}}"

[users]
colors = ["{{color4}}", "{{color5}}", "{{color2}}", "{{color3}}", "{{color6}}", "{{color1}}"]
