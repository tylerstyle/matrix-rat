# The interface thread must never wait: every call that blocks its thread is refused
# unless the place says, with `#[expect(clippy::disallowed_methods, reason = "…")]`,
# why it may (a thread of its own, a bounded wait, the program's entry point).
# Tests are exempt (see the top of src/lib.rs and of src/main.rs).
disallowed-methods = [
    { path = "std::thread::sleep", reason = "blocks its thread; on the interface thread nothing may wait" },
    { path = "std::process::Command::status", reason = "waits for the program to end" },
    { path = "std::process::Command::output", reason = "waits for the program to end" },
    { path = "std::process::Child::wait", reason = "waits for the program to end" },
    { path = "std::process::Child::wait_with_output", reason = "waits for the program to end" },
    { path = "std::thread::JoinHandle::join", reason = "waits for the thread to end" },
    { path = "std::sync::mpsc::Receiver::recv", reason = "waits without a limit" },
    { path = "tokio::runtime::Runtime::block_on", reason = "blocks its thread on a future" },
    { path = "tokio::runtime::Handle::block_on", reason = "blocks its thread on a future" },
    { path = "futures_executor::local_pool::block_on", reason = "blocks its thread on a future" },
    { path = "tokio::sync::mpsc::Receiver::blocking_recv", reason = "waits without a limit" },
    { path = "tokio::sync::mpsc::UnboundedReceiver::blocking_recv", reason = "waits without a limit" },
    { path = "tokio::sync::mpsc::Sender::blocking_send", reason = "waits without a limit" },
    # Not a blocking ban like the others: it asks the terminal for the cursor position and
    # cannot read the answer while the event stream waits for input (see `terminal::clear`).
    { path = "ratatui::Terminal::clear", reason = "asks the terminal for the cursor; use `terminal::clear`" },
    # Nor this: matrix-sdk 0.19.1 and 0.20.0 can panic in it (matrix-rust-sdk #5416, not
    # named as fixed in 0.20.0), which ended the task that asked;
    # `matrix::paging::backwards` makes that a failed load.
    { path = "matrix_sdk_ui::timeline::Timeline::paginate_backwards", reason = "can panic in matrix-sdk 0.19.1 and 0.20.0 (#5416); use `paging::backwards`" },
]
