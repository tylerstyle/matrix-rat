# Holds the dependencies to deny.toml: no known vulnerability, only the licences
# allowed there, nothing from outside crates.io. Runs for every change, and once a
# week for advisories that were published since. And checks that the core still builds
# for the browser (docs/WEB-PHASE-1.md), as scripts/check.sh does.
#
# The actions are pinned to exact commits: a tag can be moved, a commit cannot.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          # The toolchain the package asks for (rust-version in Cargo.toml).
          rust-version: "1.96.0"

  browser:
    name: core builds for the browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain the package asks for (rust-version in Cargo.toml), as the job
      # above has it, plus the browser's standard library: with warnings as errors, a
      # new release's lints would otherwise fail the check with no change here.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      # The library only: the command line (src/main.rs) is the terminal's. A check
      # needs no linker. Warnings are errors, as in scripts/check.sh.
      - name: cargo check for wasm32-unknown-unknown
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --lib --target wasm32-unknown-unknown --locked
