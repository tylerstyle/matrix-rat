# Holds the dependencies to deny.toml: no known vulnerability, only the licences
# allowed there, nothing from outside crates.io. Runs for every change, and once a
# week for advisories that were published since.
#
# The action is pinned to an exact commit: a tag can be moved, a commit cannot.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          # The toolchain the package asks for (rust-version in Cargo.toml).
          rust-version: "1.96.0"
