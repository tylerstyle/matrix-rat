# Holds the dependencies to deny.toml: no known vulnerability, only the licences
# allowed there, nothing from outside crates.io. Runs for every change, and once a
# week for advisories that were published since.
#
# The action is pinned to an exact commit: a tag can be moved, a commit cannot.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          # The toolchain the package asks for (rust-version in Cargo.toml).
          rust-version: "1.96.0"
