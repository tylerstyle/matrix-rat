# What `cargo deny check` holds the dependencies to: no known vulnerability, only
# licences that go with ours (Apache-2.0), nothing from outside crates.io.
# Run in CI (.github/workflows/checks.yml) and by hand: `cargo deny check`.

[graph]
# What is released: Linux on the two architectures the archives are built for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Unmaintained crates anywhere in the tree, not only our direct dependencies (cargo-deny
# 0.22 narrowed its default to those): a deep one still ships in the binary.
unmaintained = "all"
# Each one here is known, cannot be fixed from this side, and says why. An entry goes
# when its reason does: `cargo deny` warns about one that no longer matches anything.
ignore = [
    # Unmaintained, not vulnerable, and not ours to replace.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1, used by syntect; declared complete by its authors" },
    # Declared unmaintained on 2026-11-17. oauth2 (through matrix-sdk) uses it too, so it
    # stays in the tree whatever we do (matrix-sdk-ui moved to `jiff` with 0.20); our own
    # use (local time of a message) can move to `jiff`, which the SDK brings now.
    { id = "RUSTSEC-2026-0543", reason = "chrono, used by oauth2 (through matrix-sdk) and us; no known flaw" },
]

[licenses]
confidence-threshold = 0.9
# Permissive licences, and weak copyleft that covers only the files of the crate itself.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]

[bans]
# Several versions of one crate are the dependencies' business.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
