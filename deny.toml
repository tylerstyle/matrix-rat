# What `cargo deny check` holds the dependencies to: no known vulnerability, only
# licences that go with ours (Apache-2.0), nothing from outside crates.io.
# Run in CI (.github/workflows/checks.yml) and by hand: `cargo deny check`.

[graph]
# What is released: Linux on the two architectures the archives are built for.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Each one here is known, cannot be fixed from this side, and says why. An entry goes
# when its reason does: `cargo deny` warns about one that no longer matches anything.
ignore = [
    # SQLite before 3.54.0 can hand out stale memory when it opens a database whose
    # `-wal` file has another page size. It takes someone who can write into the
    # profile's private folder (mode 0700), who could read the store there anyway.
    # The fix needs rusqlite 0.41, which matrix-sdk-sqlite 0.19.1 does not accept:
    # it comes with the next matrix-sdk. (The Nix build links the system's SQLite.)
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite; fixed with the next matrix-sdk, attack needs write access to the private profile folder" },
    # Unmaintained, not vulnerable, and not ours to replace.
    { id = "RUSTSEC-2026-0319", reason = "anymap2, used by matrix-sdk" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1, used by syntect; declared complete by its authors" },
    # Declared unmaintained on 2026-11-17. matrix-sdk-ui and oauth2 (through matrix-sdk) use it
    # too, so it stays in the tree whatever we do; our own use (local time of a message) can
    # move to `jiff` or `time` once the SDK has moved.
    { id = "RUSTSEC-2026-0543", reason = "chrono, used by matrix-sdk-ui, oauth2 and us; no known flaw" },
]

[licenses]
confidence-threshold = 0.9
# Permissive licences, and weak copyleft that covers only the files of the crate itself.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]

[bans]
# Several versions of one crate are the dependencies' business.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
